<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitor</title>
    <style>
        :root {
            --bg:       #0d0d12;
            --surface:  #16161e;
            --surface2: #1e1e2a;
            --border:   #2a2a3a;
            --text:     #e0e0f0;
            --dim:      #7878a0;
            --accent:   #4fc3f7;
            --good:     #66bb6a;
            --warn:     #ffa726;
            --danger:   #ef5350;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
        #status-bar { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--dim); }
        #refresh-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Grid ── */
        main {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
            max-width: 1800px;
            margin: 0 auto;
        }
        .wide { grid-column: 1 / -1; }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .card-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--dim);
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--dim);
            margin: 12px 0 8px;
        }

        /* ── Stat rows ── */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--dim); }
        .stat-value { font-family: monospace; font-weight: 500; text-align: right; }

        /* ── Progress bar ── */
        .bar-wrap { display: flex; align-items: center; gap: 8px; }
        .bar-track {
            width: 100px;
            height: 5px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .good   { background: var(--good); }
        .warn   { background: var(--warn); }
        .danger { background: var(--danger); }

        /* ── Tables ── */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left;
            color: var(--dim);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 5px 8px;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            font-family: monospace;
            font-size: 13px;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--surface2); }

        /* ── Pills & dots ── */
        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .pill-good   { background: rgba(102,187,106,.15); color: var(--good); }
        .pill-warn   { background: rgba(255,167,38,.15);  color: var(--warn); }
        .pill-danger { background: rgba(239,83,80,.15);   color: var(--danger); }
        .pill-dim    { background: var(--surface2);       color: var(--dim); }
        .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
        .dot-good   { background: var(--good); }
        .dot-warn   { background: var(--warn); }
        .dot-danger { background: var(--danger); }
        .dot-dim    { background: var(--dim); }

        /* ── Loading overlay ── */
        #loading {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            font-size: 14px; color: var(--dim);
            z-index: 100;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Error banner ── */
        #error-banner {
            display: none;
            background: rgba(239,83,80,.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 16px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    Connecting to server…
</div>

<div id="error-banner"></div>

<header>
    <h1 id="header-title">Server Monitor</h1>
    <div id="status-bar">
        <span id="updated">—</span>
        <span id="countdown"></span>
        <button id="refresh-btn" onclick="refresh()">Refresh</button>
    </div>
</header>

<main id="grid" style="display:none"></main>

<script>
const INTERVAL = 60

let data = null
let countdown = INTERVAL
let countdownTimer = null

async function refresh() {
    clearInterval(countdownTimer)
    countdown = INTERVAL
    await fetchData()
    startCountdown()
}

function startCountdown() {
    clearInterval(countdownTimer)
    countdown = INTERVAL
    countdownTimer = setInterval(() => {
        countdown--
        document.getElementById('countdown').textContent = `Next update in ${countdown}s`
        if (countdown <= 0) { countdown = INTERVAL; fetchData() }
    }, 1000)
}

async function fetchData() {
    try {
        const res = await fetch('/api')
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        data = await res.json()
        document.getElementById('error-banner').style.display = 'none'
        render()
        document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`
    } catch (e) {
        showError(`Failed to fetch data: ${e.message}`)
    }
}

function showError(msg) {
    const b = document.getElementById('error-banner')
    b.textContent = msg
    b.style.display = 'block'
}

/* ── Formatting helpers ── */
function fmtBytes(bytes, dp = 1) {
    if (bytes == null || bytes === 0) return '—'
    if (bytes >= 1e9)  return (bytes / 1e9).toFixed(dp)  + ' GB'
    if (bytes >= 1e6)  return (bytes / 1e6).toFixed(dp)  + ' MB'
    if (bytes >= 1e3)  return (bytes / 1e3).toFixed(dp)  + ' KB'
    return bytes + ' B'
}

function fmtSpeed(mbps) {
    if (mbps == null) return '—'
    return mbps >= 1000 ? (mbps / 1000).toFixed(1) + ' Gbps' : mbps + ' Mbps'
}

function barColor(pct) {
    if (pct >= 90) return 'danger'
    if (pct >= 70) return 'warn'
    return 'good'
}

function bar(pct) {
    if (pct == null) return ''
    const cls = barColor(pct)
    const w = Math.min(100, Math.max(0, pct))
    return `<div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${w}%"></div></div>
    </div>`
}

function barWithLabel(pct, label) {
    if (pct == null) return `<span class="stat-value">${label ?? '—'}</span>`
    const cls = barColor(pct)
    const w = Math.min(100, Math.max(0, pct))
    return `<div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${w}%"></div></div>
        <span class="stat-value">${label ?? '—'}</span>
    </div>`
}

function pill(state) {
    const map = { running:'good', up:'good', connected:'good', stopped:'danger', down:'danger', exited:'warn', paused:'warn', restarting:'warn' }
    const cls = map[(state||'').toLowerCase()] || 'dim'
    return `<span class="pill pill-${cls}">${state || '—'}</span>`
}

function dot(state) {
    const map = { up:'good', running:'good', connected:'good', down:'danger', stopped:'danger', exited:'warn', unknown:'dim' }
    const cls = map[(state||'').toLowerCase()] || 'dim'
    return `<span class="dot dot-${cls}"></span>`
}

/* ── Card builders ── */
function statRow(label, value) {
    return `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value">${value ?? '—'}</span></div>`
}
function statRowBar(label, pct, label2) {
    return `<div class="stat-row"><span class="stat-label">${label}</span>${barWithLabel(pct, label2)}</div>`
}
function card(title, body, wide = false) {
    return `<div class="card${wide?' wide':''}"><div class="card-title">${title}</div>${body}</div>`
}

/* ── Section renderers ── */
function overviewCard(d) {
    const os  = d.OS  || {}
    const sys = d.System || {}
    const loc = d.Location || {}
    const latColor = d.Network?.latency == null ? 'dim' : d.Network.latency < 30 ? 'good' : d.Network.latency < 100 ? 'warn' : 'danger'
    const locStr = [loc.city, loc.state, loc.country].filter(Boolean).join(', ') || '—'

    const rows = [
        statRow('IP Address',  d.IPv4 || '—'),
        statRow('Location',    locStr),
        statRow('Hostname',    os.hostname || '—'),
        statRow('OS',          `${os.distro || ''} ${os.release || ''}`.trim() || '—'),
        statRow('Kernel',      os.kernel || '—'),
        statRow('Arch',        os.arch || '—'),
        statRow('Uptime',      sys.uptime || '—'),
        sys.system ? statRow('Hardware', `${sys.system.manufacturer || ''} ${sys.system.model || ''}`.trim() || '—') : '',
        sys.bios   ? statRow('BIOS',     `${sys.bios.vendor || ''} ${sys.bios.version || ''} (${sys.bios.releaseDate || '—'})`) : '',
        d.Network?.latency != null ? `<div class="stat-row"><span class="stat-label">Latency</span><span class="stat-value" style="color:var(--${latColor})">${d.Network.latency} ms</span></div>` : '',
    ]
    return card('Overview', rows.join(''))
}

function cpuCard(c) {
    if (!c) return ''
    const usage = parseFloat(c.usage)
    const rows = []

    rows.push(statRowBar('Usage', isNaN(usage) ? null : usage, isNaN(usage) ? '—' : usage.toFixed(1) + '%'))

    if (c.model?.simple) rows.push(statRow('Model', c.model.simple))

    const adv = c.model?.advanced
    if (adv) {
        if (adv.speed)         rows.push(statRow('Base Speed',   `${adv.speed} GHz`))
        if (adv.speedMax)      rows.push(statRow('Max Speed',    `${adv.speedMax} GHz`))
        if (adv.physicalCores) rows.push(statRow('Cores',        adv.physicalCores))
        if (adv.cores)         rows.push(statRow('Threads',      adv.cores))
        if (adv.socket)        rows.push(statRow('Socket',       adv.socket))
        if (adv.cache) {
            const ca = adv.cache
            if (ca.l3) rows.push(statRow('L3 Cache', fmtBytes(ca.l3)))
        }
    }

    if (c.load) {
        if (c.load.avgLoad != null) rows.push(statRow('Load Avg (1m)', c.load.avgLoad.toFixed(2)))
    }

    const temp = c.temperature
    if (temp?.main != null) rows.push(`<div class="stat-row"><span class="stat-label">Temperature</span><span class="stat-value" style="color:var(--${temp.main > 85 ? 'danger' : temp.main > 70 ? 'warn' : 'good'})">${temp.main}°C</span></div>`)

    // Per-core load
    if (c.load?.cpus?.length) {
        const cores = c.load.cpus
        rows.push(`<div class="section-title">Per-Core Load</div>`)
        rows.push(`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:4px">`)
        cores.forEach((core, i) => {
            const pct = core.load ?? 0
            const cls = barColor(pct)
            rows.push(`<div style="font-size:11px">
                <div style="color:var(--dim);margin-bottom:3px">Core ${i}</div>
                <div class="bar-track" style="width:100%"><div class="bar-fill ${cls}" style="width:${pct.toFixed(0)}%"></div></div>
                <div style="font-family:monospace;font-size:11px;margin-top:2px">${pct.toFixed(0)}%</div>
            </div>`)
        })
        rows.push(`</div>`)
    }

    return card('CPU', rows.join(''))
}

function memoryCard(m) {
    if (!m) return ''
    const usedPct = m.total ? (m.used / m.total * 100) : null
    const rows = []

    rows.push(statRowBar('Used', usedPct, `${m.used ?? '—'} / ${m.total ?? '—'} GB`))

    if (m.information) {
        const i = m.information
        if (i.swaptotal > 0) {
            const swapPct = i.swaptotal ? (i.swapused / i.swaptotal * 100) : null
            rows.push(statRowBar('Swap', swapPct, `${fmtBytes(i.swapused)} / ${fmtBytes(i.swaptotal)}`))
        }
        if (i.buffcache != null) rows.push(statRow('Buff/Cache', fmtBytes(i.buffcache)))
        if (i.available != null) rows.push(statRow('Available',  fmtBytes(i.available)))
    }

    if (m.layout?.length) {
        rows.push(`<div class="section-title">DIMMs</div>`)
        m.layout.forEach((stick, i) => {
            const desc = [
                fmtBytes(stick.size),
                stick.clockSpeed ? `${stick.clockSpeed} MHz` : '',
                stick.formFactor || '',
                stick.manufacturer || ''
            ].filter(Boolean).join(' · ')
            rows.push(statRow(`DIMM ${i + 1}`, desc || '—'))
        })
    }

    return card('Memory', rows.join(''))
}

function networkCard(n) {
    if (!n) return ''
    let html = ''

    if (n.interfaces?.length) {
        html += `<div class="card-title" style="margin-top:0">Network</div>`
        html += `<table><thead><tr><th>Interface</th><th>IP</th><th>MAC</th><th>Speed</th><th>Type</th><th>State</th></tr></thead><tbody>`
        n.interfaces.forEach(i => {
            html += `<tr>
                <td>${i.name}</td>
                <td>${i.ip4 || '—'}</td>
                <td>${i.mac || '—'}</td>
                <td>${fmtSpeed(i.speed)}</td>
                <td>${i.type || '—'}</td>
                <td>${dot(i.operstate)}${i.operstate || '—'}</td>
            </tr>`
        })
        html += `</tbody></table>`
    }

    const active = (n.stats || []).filter(s => s.rx_bytes > 0 || s.tx_bytes > 0)
    if (active.length) {
        html += `<div class="section-title" style="margin-top:14px">I/O</div>`
        html += `<table><thead><tr><th>Interface</th><th>RX/s</th><th>TX/s</th><th>Total RX</th><th>Total TX</th></tr></thead><tbody>`
        active.forEach(s => {
            html += `<tr>
                <td>${s.iface}</td>
                <td>${s.rx_sec != null ? fmtBytes(s.rx_sec) + '/s' : '—'}</td>
                <td>${s.tx_sec != null ? fmtBytes(s.tx_sec) + '/s' : '—'}</td>
                <td>${fmtBytes(s.rx_bytes)}</td>
                <td>${fmtBytes(s.tx_bytes)}</td>
            </tr>`
        })
        html += `</tbody></table>`
    }

    return `<div class="card wide">${html}</div>`
}

function diskCard(disk) {
    if (!disk) return ''
    let html = ''

    if (disk.usage?.length) {
        html += `<table><thead><tr><th>Mount</th><th>Type</th><th>Used</th><th>Free</th><th>Total</th><th>Use%</th></tr></thead><tbody>`
        disk.usage.forEach(d => {
            const cls = barColor(d.use)
            html += `<tr>
                <td>${d.mount}</td>
                <td>${d.type || '—'}</td>
                <td>${d.used} GB</td>
                <td>${d.available} GB</td>
                <td>${d.total} GB</td>
                <td><div class="bar-wrap">
                    <div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.min(100,d.use||0).toFixed(0)}%"></div></div>
                    <span>${d.use?.toFixed(1) ?? '—'}%</span>
                </div></td>
            </tr>`
        })
        html += `</tbody></table>`
    }

    if (disk.io) {
        const io = disk.io
        html += `<div class="section-title" style="margin-top:14px">Disk I/O</div>
        <div style="display:flex;gap:32px;padding:4px 0">
            <div><div style="color:var(--dim);font-size:12px;margin-bottom:2px">Read</div><div style="font-family:monospace">${io.rIO_sec != null ? io.rIO_sec.toFixed(0)+' ops/s' : '—'}</div></div>
            <div><div style="color:var(--dim);font-size:12px;margin-bottom:2px">Write</div><div style="font-family:monospace">${io.wIO_sec != null ? io.wIO_sec.toFixed(0)+' ops/s' : '—'}</div></div>
            <div><div style="color:var(--dim);font-size:12px;margin-bottom:2px">Total ops</div><div style="font-family:monospace">${io.tIO_sec != null ? io.tIO_sec.toFixed(0)+' ops/s' : '—'}</div></div>
        </div>`
    }

    if (disk.layout?.length) {
        html += `<div class="section-title" style="margin-top:14px">Drives</div>`
        html += `<table><thead><tr><th>Type</th><th>Interface</th><th>Size</th><th>Vendor</th><th>Firmware</th><th>Temp</th><th>SMART</th></tr></thead><tbody>`
        disk.layout.forEach(d => {
            const tempStr = d.temperature != null ? `${d.temperature}°C` : '—'
            const smartCls = d.smartStatus === 'Ok' ? 'good' : d.smartStatus ? 'warn' : 'dim'
            html += `<tr>
                <td>${d.type || '—'}</td>
                <td>${d.interfaceType || '—'}</td>
                <td>${fmtBytes(d.size)}</td>
                <td>${d.vendor || '—'}</td>
                <td>${d.firmwareRevision || '—'}</td>
                <td>${tempStr}</td>
                <td><span class="pill pill-${smartCls}">${d.smartStatus || '—'}</span></td>
            </tr>`
        })
        html += `</tbody></table>`
    }

    return `<div class="card wide"><div class="card-title">Disk</div>${html}</div>`
}

function processesCard(procs) {
    if (!procs?.length) return ''
    let html = `<table style="table-layout:fixed;width:100%">
        <colgroup>
            <col style="width:64px">
            <col>
            <col style="width:56px">
            <col style="width:56px">
        </colgroup>
        <thead><tr><th>PID</th><th>Name</th><th>CPU%</th><th>Mem%</th></tr></thead><tbody>`
    procs.forEach(p => {
        const cpuCls = p.cpu > 50 ? 'danger' : p.cpu > 20 ? 'warn' : ''
        html += `<tr>
            <td>${p.pid}</td>
            <td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${p.name}">${p.name}</td>
            <td style="color:var(--${cpuCls || 'text'})">${(p.cpu ?? 0).toFixed(1)}%</td>
            <td>${(p.mem ?? 0).toFixed(1)}%</td>
        </tr>`
    })
    html += `</tbody></table>`
    return card('Top Processes', html)
}

function connectionsCard(c) {
    if (!c) return ''
    const rows = [statRow('Total Connections', c.total ?? '—')]
    if (c.states) {
        Object.entries(c.states)
            .sort((a, b) => b[1] - a[1])
            .forEach(([state, count]) => rows.push(statRow(state, count)))
    }
    return card('Connections', rows.join(''))
}

function dockerCard(containers) {
    if (!containers?.length) return ''
    let html = `<table style="table-layout:fixed;width:100%">
        <colgroup>
            <col style="width:22%">
            <col>
            <col style="width:80px">
        </colgroup>
        <thead><tr><th>Name</th><th>Image</th><th>State</th></tr></thead><tbody>`
    containers.forEach(c => {
        const name = (c.name || c.names || '—').toString().replace(/^\//, '')
        html += `<tr>
            <td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${name}">${name}</td>
            <td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${c.image || ''}">${c.image || '—'}</td>
            <td>${pill(c.state)}</td>
        </tr>`
    })
    html += `</tbody></table>`
    return card('Docker Containers', html, true)
}

function usersCard(users) {
    if (!users?.length) return ''
    let html = `<table><thead><tr><th>User</th><th>TTY</th><th>Date</th><th>Command</th><th>IP</th></tr></thead><tbody>`
    users.forEach(u => {
        html += `<tr>
            <td>${u.user || '—'}</td>
            <td>${u.tty  || '—'}</td>
            <td>${u.date || '—'}</td>
            <td>${u.command || '—'}</td>
            <td>${u.ip   || '—'}</td>
        </tr>`
    })
    html += `</tbody></table>`
    return card('Logged-in Users', html)
}

/* ── Main render ── */
function render() {
    const d = data
    if (!d) return

    document.getElementById('loading').style.display = 'none'
    document.getElementById('grid').style.display = ''

    const loc = d.Location
    if (loc?.city) {
        document.title = `Monitor — ${loc.city}`
        document.getElementById('header-title').textContent = `${loc.city} — ${d.IPv4}`
    } else {
        document.getElementById('header-title').textContent = d.IPv4 || 'Server Monitor'
    }

    const cards = [
        overviewCard(d),
        cpuCard(d.CPU),
        memoryCard(d.Memory),
        connectionsCard(d.Connections),
        processesCard(d.Processes),
        usersCard(d.Users),
        networkCard(d.Network),
        diskCard(d.Disk),
        dockerCard(d.Docker),
    ].filter(Boolean)

    document.getElementById('grid').innerHTML = cards.join('')
}

fetchData()
startCountdown()
</script>
</body>
</html>
